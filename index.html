<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafiq — your Arabic pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=870">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317262B'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23F1ECE0' font-family='serif'%3E%D8%B1%3C/text%3E%3Ccircle cx='46' cy='19' r='4' fill='%23B4322A'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F1ECE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.word{font-family:var(--ar);direction:rtl;font-size:clamp(40px,9vw,62px);font-weight:600;line-height:1.6;padding:6px 0}
.word span{color:var(--rubric)}
.sub{font-family:var(--ar);direction:rtl;font-size:clamp(16px,3.4vw,21px);line-height:1.75;color:var(--verdigris);margin-top:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:32px 36px;margin-top:38px;width:min(380px,100%);text-align:left}
.card .label{margin-bottom:20px;text-align:center}
.field{margin-bottom:16px}
.field label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--rule);border-radius:3px;background:var(--paper);height:40px;padding:0 12px;font-family:var(--la);font-size:15px;color:var(--ink)}
.card .btn{width:100%;margin-top:6px}
.note{margin-top:16px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.5}
</style>
</head>
<body>
<main class="screen">
  <div class="word">بَيْنَ <span>يَدَيْكَ</span></div>
  <div class="sub">رَفِيقُكَ فِي تَعَلُّمِ الْعَرَبِيَّةِ</div>
  <form class="card" id="loginForm">
    <div class="label">Sign in to continue</div>
    <div class="field"><label for="nm">Your name</label><input id="nm" type="text" placeholder="What should we call you?" autocomplete="given-name"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••"></div>
    <button class="btn" type="submit">Login</button>
    <p class="note">Placeholder login — any details (or none) will take you straight to the dashboard for now.</p>
  </form>
</main>
<script>
  try{ const n=localStorage.getItem('bay_name'); if(n) document.getElementById('nm').value=n; }catch(_){}
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    try {
      localStorage.setItem('bay_loggedIn','1');
      const nm=(document.getElementById('nm').value||'').trim();
      if(nm) localStorage.setItem('bay_name', nm);
    } catch(_){}
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
