<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafiq — your Arabic pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=810">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F1ECE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
.hero{padding:40px 0 6px;text-align:center}
.hero .greet{font-family:var(--ar);direction:rtl;font-size:clamp(26px,6vw,36px);font-weight:600;color:var(--ink);
  line-height:1.7;margin:0 0 10px;padding:4px 0}
.hero .greet .nm{color:var(--rubric);cursor:pointer;border-bottom:1px dotted rgba(180,50,42,.4)}
.hero h1{margin:0 auto}
.hero p{margin-left:auto;margin-right:auto}
.hero h1{font-size:clamp(21px,4.4vw,26px);font-weight:700}
.hero p{color:var(--ink-soft);font-size:14.5px;margin-top:8px;max-width:52ch}
.today{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:14px}
.today b{color:var(--rubric)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:28px 0 48px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:28px;min-height:210px;position:relative;display:flex;flex-direction:column;transition:transform .18s,border-color .18s}
.tile:hover{transform:translateY(-2px);border-color:var(--verdigris)}
.tilehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:4px}
.tile .ar{font-family:var(--ar);direction:rtl;font-size:25px;font-weight:600;color:var(--ink);line-height:1.65;padding:2px 0}
.tile h2{font-size:20px;margin-top:14px}
.tile p{color:var(--ink-soft);font-size:13px;margin-top:8px;flex:1}
.tile .go{font-size:13px;color:var(--verdigris);font-weight:500;margin-top:12px}
.tile.drills .ar{color:var(--rubric)}
.corner{flex:0 0 auto}
.pickhead{font-size:16px;font-weight:700;margin:26px 0 4px}
.picksub{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.qcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;padding:16px 17px;transition:border-color .15s,transform .12s}
.qcard:hover{border-color:var(--verdigris);transform:translateY(-1px)}
.qcard .qa{font-family:var(--ar);font-size:20px;direction:rtl;line-height:1.7;color:var(--rubric)}
.qcard .qt{font-size:15.5px;font-weight:600;margin-top:2px}
.qcard .qd{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.qcard .qm{font-family:var(--ut);font-size:10.5px;color:var(--ink-soft);margin-top:9px;padding-top:8px;border-top:1px solid var(--rule)}
.qcard .qm b{color:var(--rubric)}
.bigcta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--ink);color:var(--paper);border-radius:8px;padding:18px 20px;margin:22px 0 4px;text-decoration:none}
.bigcta .bc-t{font-size:17px;font-weight:600}
.bigcta .bc-d{font-size:13px;opacity:.72;margin-top:3px}
.bigcta .bc-go{background:var(--verdigris);color:#fff;border-radius:5px;padding:11px 20px;font-size:14.5px;white-space:nowrap}
@media (max-width:860px){ .qgrid{grid-template-columns:1fr} .bigcta{flex-direction:column;align-items:stretch}
  .bigcta .bc-go{text-align:center} }
.stat{font-family:var(--ut);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.stat b{color:var(--rubric);font-weight:600}
.stat.none{color:var(--ink-soft)}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="dashboard.html">رَفِيق<span class="bmark"></span></a>
  <div class="navlinks">

  </div>
</nav>
<main class="wrap">
  <section class="hero">
    <div class="greet" id="greetAr">السَّلامُ عَلَيْكُم</div>
    <h1>How do you want to learn today?</h1>
    <p>Words, sentences, verbs or connectors — start wherever you like.</p>
  </section>
  <div id="picker"></div>
</main>
<script src="vocab-data.js?v=810"></script>
<script>
/* Both apps keep their own schedule; the dashboard just reports on each. */
const DAY=86400000, dayNow=Math.floor(Date.now()/DAY), iso=new Date().toISOString().slice(0,10);
function read(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(_){return null}}

const NAME_KEY='bay_name';
function getName(){ try{return (localStorage.getItem(NAME_KEY)||'').trim()}catch(_){return ''} }
function setName(n){ try{localStorage.setItem(NAME_KEY,n.trim())}catch(_){} paintGreeting(); }
function askName(){
  const n=prompt('What should the app call you?', getName());
  if(n!==null) setName(n);
}
function paintGreeting(){
  const name=getName();
  const el=document.getElementById('greetAr');
  el.innerHTML='السَّلامُ عَلَيْكُم' +
    (name? ' يا <span class="nm" title="Tap to change">'+name+'</span>' : '');
  const nm=el.querySelector('.nm');
  if(nm) nm.onclick=askName;                 // the name itself is the control
}
paintGreeting();

(function picker(){
  const el=document.getElementById('picker');
  if(!el) return;
  const dr=read('bay_drills_progress_v1'), vc=read('bay_vocab_progress_v1');
  let drDue=0, drKnown=0;
  if(dr&&dr.items) Object.values(dr.items).forEach(r=>{if(r.due<=iso)drDue++;if(r.box>=3)drKnown++});
  let vcDue=0, vcNew=0;
  const vTotal=(typeof VOCAB!=='undefined')?VOCAB.length:0;
  if(vc) Object.values(vc).forEach(r=>{if(!r||!r.box){vcNew++;return}if(r.due!=null&&r.due<=dayNow)vcDue++});
  else vcNew=vTotal;

  const cards=[
    {href:'vocab.html', ar:'مُفْرَدات', t:'Words',
     d:'Daily spaced-repetition review of the book\u2019s 622 words.',
     m: vcDue? `<b>${vcDue}</b> due today` : `${vTotal-vcNew} started of ${vTotal}`},
    {href:'drills.html', ar:'جُمَل', t:'Sentences',
     d:'Twelve drills across units 1\u201312 \u2014 dialogue, ladders, gap-fill, production.',
     m: drDue? `<b>${drDue}</b> due today` : `${drKnown} known of 672`},
    {href:'verbs.html?tab=drill', ar:'أَفْعال', t:'Practise your tenses',
     d:'Past, present and future across 21 verbs \u2014 table, drill, then in a sentence.',
     m:'21 verbs \u00b7 18 forms each'},
    {href:'connectors.html?tab=ex', ar:'رَوابِط', t:'Joining words',
     d:'\u062B\u064F\u0645\u0651 \u00b7 \u0644\u0623\u0646\u0651 \u00b7 \u0644\u0643\u0646\u0651 \u2014 plus question and opinion openers.',
     m:'53 connectors \u00b7 24 exercises'}
  ];
  const total=drDue+vcDue;
  el.innerHTML =
    `<a class="bigcta" href="drills.html?start=1">
       <div><div class="bc-t">Start today\u2019s session</div>
       <div class="bc-d">${total? total+' item'+(total===1?'':'s')+' waiting across words and sentences' : 'A short mixed set, picked for you'}</div></div>
       <span class="bc-go">Start →</span></a>
     <div class="pickhead">Or pick something specific</div>
     <p class="picksub">Each one is a self-contained way in — no need to work through them in order.</p>
     <div class="qgrid">` +
    cards.map(c=>`<a class="qcard" href="${c.href}">
       <div class="qa">${c.ar}</div><div class="qt">${c.t}</div>
       <div class="qd">${c.d}</div><div class="qm">${c.m}</div></a>`).join('') +
    `</div>`;
})();


</script>
